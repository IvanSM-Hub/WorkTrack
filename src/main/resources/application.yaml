spring:
  application:
    name: WorkTrack
  config:
    import:
      - optional:file:../.env
  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST_WORKTRACK:localhost}:${POSTGRES_PORT_WORKTRACK:5433}/${POSTGRES_DB_WORKTRACK:worktrack_db}
    username: ${POSTGRES_USER_WORKTRACK:worktrack_admin}
    password: ${POSTGRES_PASSWORD_WORKTRACK:worktrack_password_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

secureauth:
  api:
    base-url: ${SECUREAUTH_API_BASE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  show-actuator: true
  
logging:
  level:
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR